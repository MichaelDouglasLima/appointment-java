# ==============================
# Aplicação
# ==============================
spring.application.name=agenda

# Ativa cores ANSI no console (erros em vermelho, etc.)
spring.output.ansi.enabled=always

# Remove stacktrace dos erros exibidos no navegador
spring.web.error.include-stacktrace=never

# ==============================
# Banco de Dados (H2 em memória)
# ==============================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

# Encoding padrão para scripts SQL
spring.sql.init.encoding=UTF-8

# Garante que o JPA crie as tabelas antes de rodar o data.sql
spring.jpa.defer-datasource-initialization=true

spring.flyway.enabled=false